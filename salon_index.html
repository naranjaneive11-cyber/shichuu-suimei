<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stargazer Salon Portal | 開運似合わせビューティー</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="サロンポータル">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="salon_customer.css">
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .portal-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            max-width: 800px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 30px rgba(245, 158, 11, 0.1);
        }
        .portal-title-brand {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #fbbf24;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .portal-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, #fde68a 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .portal-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.6;
        }
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .portal-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 2rem 1.5rem;
            text-decoration: none;
            border-radius: 20px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .portal-btn.customer {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(6, 78, 59, 0.4) 100%);
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }
        .portal-btn.customer:hover {
            transform: translateY(-4px);
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(6, 78, 59, 0.6) 100%);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }
        .portal-btn.staff {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(180, 83, 9, 0.4) 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
        }
        .portal-btn.staff:hover {
            transform: translateY(-4px);
            border-color: #f59e0b;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(180, 83, 9, 0.6) 100%);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.3);
        }
        .portal-btn-icon {
            font-size: 2.2rem;
        }
        .portal-btn-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
        }
        .portal-btn-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .portal-footer {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
        @media (max-width: 600px) {
            .portal-card {
                padding: 1.5rem 1rem;
            }
            .portal-title {
                font-size: 1.7rem;
            }
            .portal-btn {
                padding: 1.5rem 1rem;
            }
            .portal-btn-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="portal-title-brand">Hair & Mind Well-Being Salon DX</div>
        <h1 class="portal-title">Stargazer Salon Portal</h1>
        <p class="portal-desc">
            外見の美しさを整え、内なる四柱推命エレメントを高める。「開運似合わせ」店舗専用DXポータル
        </p>

        <div class="portal-grid">
            <!-- お客様用 -->
            <a href="salon_customer.html" class="portal-btn customer">
                <span class="portal-btn-icon">✨</span>
                <span class="portal-btn-title" style="color: #a7f3d0;">お客様用 開運ヘア診断</span>
                <p class="portal-btn-desc">
                    セット面のiPadやスマホからセルフ診断。<br>自分自身のエレメントや開運カラー、待ち受け画像をその場でチェック。
                </p>
            </a>

            <!-- スタイリスト用 -->
            <a href="salon_cheat_sheet.html" class="portal-btn staff">
                <span class="portal-btn-icon">✂️</span>
                <span class="portal-btn-title" style="color: #fef08a;">スタイリスト専用コンシェルジュ</span>
                <p class="portal-btn-desc">
                    お客様に合わせた本質アプローチDo/Don't・ヘアカラー処方・電子カルテでの写真付き施術記録。
                </p>
            </a>
        </div>

        <div class="portal-footer">
            © Hair & Mind Salon Stargazer. All rights reserved.
        </div>
    </div>

    <script>
        // PWA Service Worker 登録（強制キャッシュクリア＆自動リロード対応）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then((reg) => {
                    console.log('✅ ServiceWorker Registered! Scope:', reg.scope);
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        newWorker.addEventListener('statechange', () => {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('🔄 New Service Worker version installed. Force reloading...');
                                window.location.reload();
                            }
                        });
                    });
                }).catch((err) => console.warn('ServiceWorker Registration failed:', err));
            });
        }
    </script>
</body>
</html>
